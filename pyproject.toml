[project]
name = "fpl-predictor"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Stewart Honeyman", email = "stewart.honeyman1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "pulp>=3.3.2",
    "requests>=2.34.2",
]

[project.scripts]
fpl = "fpl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpl"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
